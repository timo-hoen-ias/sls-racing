name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run world:fixture
      # Unreal port: export the fixture world and prove its collision answers every road cell like the web game's.
      - run: node unreal/tools/export-tiles.ts --out=/tmp/ue-fixture && node unreal/tools/verify-export.ts --data=/tmp/ue-fixture --max=0
      - run: node unreal/tools/gen-shaders.ts --check
      - run: npm run build
