GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/SlsRacing.SlsGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False

[/Script/Engine.Engine]
bUseFixedFrameRate=False

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-981.0
bEnableEnhancedDeterminism=False
; Same split as the web game's Rapier groups (src/vehicle/carPhysics.ts CAR_GROUPS / ROAD_GROUPS):
; SlsRoad   object type of carriageways, pavements and paths: only wheel rays hit them, the car body drives through.
; SlsWheel  trace channel of the wheel rays: blocked by everything.
; SlsChassis trace channel of chassis probes: road surfaces ignore it.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="SlsRoad")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="SlsWheel")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="SlsChassis")
